[package]
name = "rcpeh-psi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"

[dependencies]
nova-snark = { git = "https://github.com/microsoft/Nova", rev = "01b1e2d662a847ed7029770ecbaf6687398899dd", default-features = false }
ff = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde", "std"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
debug = 0
lto = "thin"
